    - assets/500ml.jpg
    - assets/750ml.jpg
    - assets/1000ml.jpg
    - assets/productos/45ml.png
    - assets/productos/150ml.png
    - assets/productos/250ml.png
    - assets/productos/500ml.png
    - assets/productos/750ml.png
    - assets/productos/1000ml.png
    - assets/promos/enero.png
    - assets/promos/febrero.png
    - assets/promos/marzo.png
    - assets/promos/abril.png
    - assets/promos/mayo.png
    - assets/promos/junio.png
    - assets/promos/julio.png
    - assets/promos/agosto.png
    - assets/promos/septiembre.png
    - assets/promos/octubre.png
    - assets/promos/noviembre.png
    - assets/promos/diciembre.png
    - assets/avatares/avatar1.png
    - assets/avatares/avatar2.png
    - assets/avatares/avatar3.png
    - assets/avatares/avatar4.png
    - assets/avatares/avatar5.png
    - assets/avatares/avatar6.png
    - assets/avatares/avatar7.png
    - assets/avatares/avatar8.png
