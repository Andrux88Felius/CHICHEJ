name: chichej
description: "App para la venta de Chicha."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  shared_preferences: ^2.2.0
  permission_handler: ^11.0.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10
  url_launcher: ^6.3.2
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logochichej.png
